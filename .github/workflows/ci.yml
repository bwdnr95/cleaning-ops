name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleanops
          POSTGRES_PASSWORD: cleanops
          POSTGRES_DB: cleanops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanops -d cleanops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Compile sanity check
        run: python -m compileall app tests

      - name: Pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite:///./ci_cleaning_ops.db"
          FRONTEND_URL: "http://localhost:5173"
          STORAGE_ROOT: "ci_storage"
          MESSAGE_PROVIDER: "mock"
          SECRET_KEY: "ci-secret-not-used-in-prod-but-32chars-long-x"
        run: python -m pytest -q

      - name: Apply Alembic migrations (SQLite)
        env:
          DATABASE_URL: "sqlite:///./ci_migrations.sqlite"
        run: |
          python -m alembic upgrade head
          python -m scripts.seed_dev
          python -m alembic current

      - name: Apply Alembic migrations (PostgreSQL)
        env:
          DATABASE_URL: "postgresql+psycopg://cleanops:cleanops@localhost:5432/cleanops_ci"
        run: |
          python -m alembic upgrade head
          python -m scripts.seed_dev
          python -m alembic current

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: "/api"
        run: npm run build
