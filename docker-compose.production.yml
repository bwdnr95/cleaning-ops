services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cleanops}
      POSTGRES_USER: ${POSTGRES_USER:-cleanops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cleanops} -d ${POSTGRES_DB:-cleanops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cleanops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cleanops}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:?set S3_PRIVATE_BUCKET}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL}
      MESSAGE_PROVIDER: solapi
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:?set SOLAPI_API_KEY}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:?set SOLAPI_API_SECRET}
      SOLAPI_SENDER_NUMBER: ${SOLAPI_SENDER_NUMBER:?set SOLAPI_SENDER_NUMBER}
      SOLAPI_WEBHOOK_SECRET: ${SOLAPI_WEBHOOK_SECRET:?set SOLAPI_WEBHOOK_SECRET}
      SOLAPI_KAKAO_PF_ID: ${SOLAPI_KAKAO_PF_ID:-}
      SOLAPI_KAKAO_CHANNEL_ID: ${SOLAPI_KAKAO_CHANNEL_ID:-}
      SOLAPI_KAKAO_TEMPLATE_CUSTOMER_SCHEDULE_CONFIRMED: ${SOLAPI_KAKAO_TEMPLATE_CUSTOMER_SCHEDULE_CONFIRMED:?set SOLAPI_KAKAO_TEMPLATE_CUSTOMER_SCHEDULE_CONFIRMED}
      SOLAPI_KAKAO_TEMPLATE_CUSTOMER_DAY_BEFORE: ${SOLAPI_KAKAO_TEMPLATE_CUSTOMER_DAY_BEFORE:?set SOLAPI_KAKAO_TEMPLATE_CUSTOMER_DAY_BEFORE}
      SOLAPI_KAKAO_TEMPLATE_PARTNER_JOB_ASSIGNMENT: ${SOLAPI_KAKAO_TEMPLATE_PARTNER_JOB_ASSIGNMENT:?set SOLAPI_KAKAO_TEMPLATE_PARTNER_JOB_ASSIGNMENT}
      SOLAPI_KAKAO_TEMPLATE_CUSTOMER_PHOTO_READY: ${SOLAPI_KAKAO_TEMPLATE_CUSTOMER_PHOTO_READY:?set SOLAPI_KAKAO_TEMPLATE_CUSTOMER_PHOTO_READY}
      SOLAPI_KAKAO_TEMPLATE_CUSTOMER_BALANCE_DUE: ${SOLAPI_KAKAO_TEMPLATE_CUSTOMER_BALANCE_DUE:?set SOLAPI_KAKAO_TEMPLATE_CUSTOMER_BALANCE_DUE}
      SOLAPI_KAKAO_TEMPLATE_CUSTOMER_QUOTE: ${SOLAPI_KAKAO_TEMPLATE_CUSTOMER_QUOTE:?set SOLAPI_KAKAO_TEMPLATE_CUSTOMER_QUOTE}
      SOLAPI_KAKAO_TEMPLATE_PARTNER_CUSTOMER_INFO: ${SOLAPI_KAKAO_TEMPLATE_PARTNER_CUSTOMER_INFO:?set SOLAPI_KAKAO_TEMPLATE_PARTNER_CUSTOMER_INFO}
      SOLAPI_KAKAO_TEMPLATE_PARTNER_AS_REQUEST: ${SOLAPI_KAKAO_TEMPLATE_PARTNER_AS_REQUEST:?set SOLAPI_KAKAO_TEMPLATE_PARTNER_AS_REQUEST}
      SOLAPI_KAKAO_TEMPLATE_CUSTOMER_AS_NOTICE: ${SOLAPI_KAKAO_TEMPLATE_CUSTOMER_AS_NOTICE:?set SOLAPI_KAKAO_TEMPLATE_CUSTOMER_AS_NOTICE}
      SOLAPI_ALIMTALK_FALLBACK_SMS: ${SOLAPI_ALIMTALK_FALLBACK_SMS:-true}
      AUTOMATION_SEND_PARTNER_ASSIGNMENT: ${AUTOMATION_SEND_PARTNER_ASSIGNMENT:-true}
      AUTOMATION_SEND_SCHEDULE_CONFIRMED: ${AUTOMATION_SEND_SCHEDULE_CONFIRMED:-true}
      AUTOMATION_SEND_CUSTOMER_PHOTO_READY: ${AUTOMATION_SEND_CUSTOMER_PHOTO_READY:-false}
      AUTOMATION_SEND_CUSTOMER_BALANCE_DUE: ${AUTOMATION_SEND_CUSTOMER_BALANCE_DUE:-true}
      AUTOMATION_DAY_BEFORE_NOTICE_SCHEDULER_ENABLED: ${AUTOMATION_DAY_BEFORE_NOTICE_SCHEDULER_ENABLED:-true}
      AUTOMATION_DAY_BEFORE_NOTICE_HOUR: ${AUTOMATION_DAY_BEFORE_NOTICE_HOUR:-10}
      AUTOMATION_DAY_BEFORE_NOTICE_MINUTE: ${AUTOMATION_DAY_BEFORE_NOTICE_MINUTE:-0}
      AUTOMATION_NOTIFICATION_RECOVERY_ENABLED: ${AUTOMATION_NOTIFICATION_RECOVERY_ENABLED:-true}
      AUTOMATION_NOTIFICATION_RECOVERY_INTERVAL_SECONDS: ${AUTOMATION_NOTIFICATION_RECOVERY_INTERVAL_SECONDS:-60}
      MESSAGE_PENDING_RETRY_AFTER_MINUTES: ${MESSAGE_PENDING_RETRY_AFTER_MINUTES:-15}
      SENTRY_DSN: ${SENTRY_DSN:?set SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}

volumes:
  postgres-data:
