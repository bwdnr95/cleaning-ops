[project]
name = "cleaning-ops-backend"
version = "0.1.0"
description = "FastAPI backend for Cleaning Ops Control Center"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "bcrypt>=4.0.0",
  "python-jose[cryptography]>=3.3.0",
  "openpyxl>=3.1.0",
  "boto3>=1.34.0",
  "psycopg[binary]>=3.2.0",
  "sentry-sdk[fastapi]>=2.0.0",
  "structlog>=24.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/import_cleanjob_spreadsheet.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
