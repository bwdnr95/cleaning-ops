services:
  postgres:
    image: postgres:16
    container_name: cleanops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cleaning_ops
      POSTGRES_USER: cleanops
      POSTGRES_PASSWORD: cleanops_local_dev
    ports:
      - "5434:5432"
    volumes:
      - cleanops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanops -d cleaning_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cleanops_pgdata:
